<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A living artwork. The second atmosphere surrounding Earth — composed of attention, emotion, memory and collective consciousness.">
  <title>The Second Atmosphere</title>

  <!-- Google Fonts: Cormorant Garamond for cinematic display, Inter for utility -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@300;400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Three.js canvas mounts here via JS -->
  <canvas id="globe-canvas"></canvas>

  <!-- Title overlay — kept minimal, floats above the planet -->
  <header class="ui-overlay">
    <div class="wordmark">
      <h1 class="title">The Second Atmosphere</h1>
      <p class="subtitle">Collective human consciousness made visible.</p>
      <p class="hint">Press <kbd>H</kbd> to show the colour table</p>
    </div>
  </header>

  <!-- Bottom left: the year whose data is shaping the field, and how thick its record is -->
  <footer class="ui-overlay ui-footer">
    <span class="year-label" aria-live="polite"><span class="year-text" id="year-label"></span></span>
    <span class="record-label year-text" id="record-label"></span>
  </footer>

  <!-- Three.js r128 -->
  <script src="three.min.js"></script>
  <!-- Core scene -->
  <script src="main.js"></script>
  <!-- Planetary Signal pipeline -->
  <script src="signal.js"></script>
  <!-- GDELT global event adapter — fetches via the second-atmosphere-gdelt Worker -->
  <script src="gdelt-adapter.js"></script>
  <!-- Years — the field passes through the same moment in earlier years -->
  <script src="years.js"></script>
  <!-- The visitors' archive — a second archive, kept by people (add.html) -->
  <script src="vendor/qrcode.js"></script>
  <script src="visitors.js"></script>
  <!-- The physical trace — sends a line per year to a thermal printer (?printer) -->
  <script src="printer.js"></script>
  <!-- Debug overlay — press H to show/hide -->
  <script src="debug.js"></script>
  <!-- Planetary Resonance — injects its own speaker icon, reads window.planetarySignal directly -->
  <script src="audio.js"></script>
  <!-- The film cut — records one full window at 1920 × 1080 (?film) -->
  <script src="film.js"></script>

</body>
</html>
